# Ejemplo completo de archivo de reglas para jsonmask
# Este archivo muestra todas las estrategias disponibles

rules:
  # ============================================
  # ESTRATEGIA: redact
  # Reemplaza el valor completo con un placeholder
  # ============================================
  - path: "user.email"
    strategy: "redact"
    # replace_with es opcional, default: "****"
    replace_with: "****@****.***"

  - path: "user.ssn"
    strategy: "redact"
    replace_with: "***-**-****"

  # ============================================
  # ESTRATEGIA: partial
  # Mantiene parte del valor, enmascara el resto
  # ============================================
  - path: "payment.card_number"
    strategy: "partial"
    keep_start: 4        # Mantener primeros 4 caracteres
    keep_end: 4          # Mantener últimos 4 caracteres
    mask_char: "*"       # Carácter de enmascarado

  - path: "user.phone"
    strategy: "partial"
    keep_start: 0
    keep_end: 4
    mask_char: "•"       # Puede usar otros caracteres

  # ============================================
  # ESTRATEGIA: hash
  # Aplica SHA256 y muestra un prefijo
  # ============================================
  - path: "auth.token"
    strategy: "hash"
    hash_prefix_length: 8     # Longitud del prefijo del hash
    hash_prefix: ""           # Prefijo opcional antes del hash

  - path: "auth.api_key"
    strategy: "hash"
    hash_prefix_length: 12
    hash_prefix: "hash:"      # Resultado: "hash:abc123def456"

  # ============================================
  # ESTRATEGIA: replace
  # Reemplaza con un valor literal específico
  # ============================================
  - path: "debug.internal_id"
    strategy: "replace"
    replace_with: "[INTERNAL]"

  # ============================================
  # ESTRATEGIA: regex
  # Aplica expresión regular con reemplazo
  # ============================================
  - path: "headers.authorization"
    strategy: "regex"
    pattern: "Bearer\\s+(.+)"   # Regex pattern
    replace_with: "Bearer ****"  # Reemplazo

  - path: "connection_string"
    strategy: "regex"
    pattern: "password=([^;]+)"
    replace_with: "password=****"

  # ============================================
  # ESTRATEGIA: entropy
  # Detecta valores de alta entropía (tokens aleatorios)
  # ============================================
  - path: "data.secret_value"
    strategy: "entropy"
    entropy_min: 3.5           # Umbral mínimo de entropía
    replace_with: "[HIGH-ENTROPY]"

  # ============================================
  # WILDCARDS
  # Aplica reglas a múltiples paths
  # ============================================
  # Todos los emails en cualquier objeto
  - path: "*.email"
    strategy: "redact"

  # Todos los elementos de una lista
  - path: "users.*.password"
    strategy: "redact"

  # Índices específicos
  - path: "items[0].secret"
    strategy: "redact"

  # Wildcard de índice
  - path: "records[*].sensitive_field"
    strategy: "hash"
    hash_prefix_length: 8

  # ============================================
  # CVV y otros campos de pago
  # ============================================
  - path: "payment.cvv"
    strategy: "redact"
    replace_with: "***"

  - path: "cards.*.cvv"
    strategy: "redact"
    replace_with: "***"

  - path: "cards.*.number"
    strategy: "partial"
    keep_start: 6
    keep_end: 4
    mask_char: "X"
