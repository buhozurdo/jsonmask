name: Publish to Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    name: "Build and Attach Assets"
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install build tools and dependencies
        run: |
          python -m pip install --only-binary :all: --upgrade pip
          python -m pip install --only-binary :all: build

      - name: Build dists (.whl and .tar.gz)
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct) \
          python -m build

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.2.1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}